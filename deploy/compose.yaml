name: autoforce-production

x-log: &log
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
x-limits: &limits
  mem_limit: 1g
  cpus: 1.0

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: autoforce
      POSTGRES_USER: autoforce
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set private POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - pgbackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoforce -d autoforce"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks: [data]
    logging: *log
    mem_limit: 2g
    cpus: 2.0

  mongo:
    image: mongo:7.0
    command: ["mongod", "--bind_ip_all", "--auth"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set Mongo root username}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set Mongo root password}
    volumes:
      - mongodata:/data/db
      - mongobackups:/backups
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping:1}).ok' | grep -q 1"]
      interval: 15s
      timeout: 5s
      retries: 6
    networks: [data]
    logging: *log
    mem_limit: 2g
    cpus: 2.0

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      APP_ENV: production
      PORT: "8010"
      DATABASE_URL: ${DATABASE_URL:?Set private DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?Set private JWT_SECRET}
      WORKER_SECRET: ${WORKER_SECRET:?Set private WORKER_SECRET}
      CRM_CREDENTIAL_ENCRYPTION_KEY: ${CRM_CREDENTIAL_ENCRYPTION_KEY:?Set private key}
      RATE_LIMIT_SINGLE_PROCESS: "1"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Set public HTTPS origin}
      ALLOW_EMAIL_REGISTER: "false"
      CRM_BACKGROUND_WORKER_ENABLED: "1"
      GENESIS_CRM_URL: http://genesis-server:5000
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      postgres: { condition: service_healthy }
      genesis-server: { condition: service_healthy }
    networks: [data, app]
    logging: *log
    mem_limit: 2g
    cpus: 2.0

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    environment:
      GEO_SERVER_URL: http://backend:8010/api/v1
      WORKER_SECRET: ${WORKER_SECRET:?Set private WORKER_SECRET}
      RPA_HEADLESS: "true"
    depends_on:
      backend: { condition: service_healthy }
    networks: [app]
    logging: *log
    mem_limit: 2g
    cpus: 2.0

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        INTERNAL_API_URL: http://backend:8010
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    networks: [app]
    logging: *log
    mem_limit: 1g
    cpus: 1.0

  genesis-server:
    build:
      context: ../../Genesis_CRM/server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "5000"
      HOST: 0.0.0.0
      UPLOAD_DIR: /data/uploads
      MONGODB_URI: ${GENESIS_MONGODB_URI:?Set Mongo URI with URL-encoded credentials and authSource=admin}
      JWT_SECRET: ${GENESIS_JWT_SECRET:?Set distinct Genesis JWT secret}
      ADMIN_PASSWORD: ${GENESIS_ADMIN_PASSWORD:?Set Genesis admin password}
      MAIL_CREDENTIAL_ENCRYPTION_KEY: ${GENESIS_MAIL_CREDENTIAL_ENCRYPTION_KEY:?Set Genesis mail key}
      TRACKING_BASE_URL: ${GENESIS_TRACKING_BASE_URL:?Set Genesis HTTPS URL}
      CORS_ORIGIN: ${GENESIS_CORS_ORIGIN:?Set Genesis HTTPS CORS origin}
    volumes:
      - genesis_uploads:/data/uploads
      - mongobackups:/backups
    depends_on:
      mongo: { condition: service_healthy }
    networks: [data, app]
    logging: *log
    mem_limit: 2g
    cpus: 2.0

  genesis-web:
    build:
      context: ../../Genesis_CRM/web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    depends_on:
      genesis-server: { condition: service_healthy }
    networks: [app]
    logging: *log
    mem_limit: 512m
    cpus: 1.0

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set app public DNS}
      CRM_DOMAIN: ${CRM_DOMAIN:?Set CRM public DNS}
    volumes:
      - ./nginx/conf.d/production.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      web: { condition: service_healthy }
      genesis-web: { condition: service_healthy }
    networks: [app]
    logging: *log
    mem_limit: 256m
    cpus: 0.5

networks:
  app: {}
  data:
    internal: true
volumes:
  pgdata: {}
  pgbackups: {}
  mongodata: {}
  mongobackups: {}
  uploads: {}
  genesis_uploads: {}

# ONLY for first ACME issuance before real certificates exist.
# Not the production runtime configuration: no HTTPS listener until certs issued.
server {
    listen 80;
    server_name app.example.com crm.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 503; }
}

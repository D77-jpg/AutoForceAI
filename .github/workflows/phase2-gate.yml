name: phase2-release-gate

# 阶段 2 发布门禁：CRM 测试、迁移、PG 离线 DDL、Web 构建、敏感信息检查、兼容性记录。
# 通过本门禁是「允许推送 + 24h 试运行」的前置条件。

on:
  push:
    branches: [codex/phase2-release-ready, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: services/digital-brain
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest alembic
      - name: CRM 相关及新增测试（全量后端回归）
        run: python -m pytest tests/ -q
      - name: 契约测试（仓库内冻结副本，skip=0 强制）
        shell: pwsh
        run: |
          $out = python -m pytest tests/test_crm_contract.py -q -rs 2>&1 | Out-String
          $out
          if ($out -match '\d+ skipped') { Write-Error "契约测试出现 skip，门禁失效"; exit 1 }
      - name: Alembic 空库升级 + 阶段1库升级 + downgrade（test_migrations.py 内含）
        run: python -m pytest tests/test_migrations.py -q
      - name: PostgreSQL 离线 DDL（显式 PG dialect，断言方言与关键对象）
        run: python -m pytest tests/test_migrations.py::test_postgresql_offline_sql_generation -q
      - name: PostgreSQL 离线 DDL 直验（-x url 指定 dialect，不连接数据库）
        shell: pwsh
        run: |
          python -m alembic -x "url=postgresql+psycopg://gate:gate@127.0.0.1:9/phase2_gate" upgrade head --sql > "$env:TEMP\pg_ddl.sql"
          $ddl = Get-Content "$env:TEMP\pg_ddl.sql" -Raw
          foreach ($needle in @("SERIAL NOT NULL", "CREATE EXTENSION IF NOT EXISTS vector", "CREATE TYPE taskstatus", "CREATE TABLE crm_worker_state", "outcome_lease_owner", "uq_crm_link_org_lead_project", "uq_crm_config_provider_project", "TIMESTAMP WITHOUT TIME ZONE")) {
            if (-not $ddl.Contains($needle)) { Write-Error "离线 DDL 缺少: $needle"; exit 1 }
          }
          if ($ddl.Contains("AUTOINCREMENT")) { Write-Error "生成了 SQLite 方言而非 PostgreSQL"; exit 1 }

  web:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/web-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # web-console 独立安装（根 package.json 不再声明 workspaces，子目录 lockfile 为准）
      - name: Install（锁定依赖）
        run: npm ci --legacy-peer-deps
      - name: TypeScript 检查
        run: npm run typecheck
      - name: Production build
        run: npm run build

  hygiene:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: 敏感信息检查（全历史不得出现 service token）
        shell: bash
        run: |
          if git grep -nE 'gci_[0-9a-f]{20,}' $(git rev-list origin/main..HEAD 2>/dev/null || git rev-list HEAD) -- . | grep -v 'tests/test_crm_credentials.py'; then
            echo "::error::发现疑似 service token 进入提交历史"; exit 1
          fi
          echo "OK: 历史中无 service token"
      - name: 禁止提交 .env / 数据库文件 / 日志
        shell: bash
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env($|\.)|\.db$|\.sqlite|(^|/)logs?/.*\.log$' | grep -v '\.env\.example' || true)
          if [ -n "$bad" ]; then echo "::error::禁止提交的文件: $bad"; exit 1; fi
          echo "OK: 无 .env/db/日志入库"
      - name: 兼容性记录校验（版本 + 完整契约哈希 + 双方实现基线）
        shell: bash
        run: |
          f=docs/integration/COMPATIBILITY.md
          test -f "$f" || { echo "::error::缺少兼容性记录"; exit 1; }
          grep -qF "契约版本：**1.0**" "$f" || { echo "::error::缺少契约版本 1.0"; exit 1; }
          grep -qF "7798eb621795e8dc405ff56c0fdfb806622ec5a6144d85d6e839ee85d9061679" "$f" || { echo "::error::契约哈希缺失或不匹配"; exit 1; }
          grep -qF "e2e3486" "$f" || { echo "::error::缺少 Genesis 实现基线 commit"; exit 1; }
          grep -qF "491b1d3" "$f" || { echo "::error::缺少 AutoForceAI 实现基线 commit"; exit 1; }
          grep -qF "genesis-integration-v1.0.0" "$f" || { echo "::error::缺少 Genesis 标签名"; exit 1; }
          grep -qF "autoforce-phase2-core-v1.0.0" "$f" || { echo "::error::缺少 AutoForceAI 标签名"; exit 1; }
          # 仓库内冻结契约副本哈希
          actual=$(sha256sum docs/integration/integration-v1.openapi.yaml | cut -d' ' -f1)
          [ "$actual" = "7798eb621795e8dc405ff56c0fdfb806622ec5a6144d85d6e839ee85d9061679" ] || { echo "::error::契约副本哈希漂移: $actual"; exit 1; }
          echo "OK: 兼容性记录与契约副本校验通过"
